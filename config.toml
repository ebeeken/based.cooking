title = 'Based Cooking'
defaultContentLanguage = 'de'
baseURL = 'https://food.ebeeken.de/'
locale = 'de-de'
theme = 'lugo'

[params]
  favicon = "/favicon.svg"
  stylesheet = "/style.css"
  indexarticles = 50
  taglist = true
  datesinlist = false
  authorsinlist = false
  nextprev = false
  showrss = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
