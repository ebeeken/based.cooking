title = 'Schnelles Kochen'
defaultContentLanguage = 'de'
enableGitInfo = true
baseURL = 'https://food.ebeeken.de/'
locale = 'de-de'
theme = 'lugo'

[params]
  favicon = "/favicon.svg"
  stylesheet = "/style.css"
  indexarticles = 50
  taglist = true
  datesinlist = false
  authorsinlist = false
  nextprev = false
  showrss = true
  relatedtext = "Verwandt"
  repo = "https://github.com/ebeeken/based.cooking"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
